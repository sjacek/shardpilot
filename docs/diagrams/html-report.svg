<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="669px" preserveAspectRatio="none" style="width:981px;height:669px;background:#FFFFFF;" version="1.1" viewBox="0 0 981 669" width="981px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="385.075" x="294.755" y="24.533">Coverage reports: one snapshot, independent consumers</text></g><!--entity inputs--><g class="entity" id="ent0001"><rect fill="#F1F5F9" height="58.219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="218.344" x="263.5" y="45.609"/><polygon fill="#F1F5F9" points="464.844,50.609,464.844,64.609,476.844,64.609,476.844,56.609,470.844,50.609,464.844,50.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="470.844" x2="470.844" y1="50.609" y2="56.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="476.844" x2="470.844" y1="56.609" y2="56.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="183.299" x="273.5" y="73.143">Downloaded baseline + plans</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="188.344" x="273.5" y="90.752">Actual files only when enabled</text></g><!--entity snapshot--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="255.785" x="244.5" y="182.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="162.647" x="254.5" y="207.143">One immutable evaluation</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="235.785" x="254.5" y="224.752">Valid sets + file errors + gate outcome</text></g><!--entity json--><g class="entity" id="ent0003"><rect fill="#F1F1F1" height="58.219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="207.399" x="7" y="307.609"/><polygon fill="#F1F1F1" points="197.399,312.609,197.399,326.609,209.399,326.609,209.399,318.609,203.399,312.609,197.399,312.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="203.399" x2="203.399" y1="312.609" y2="318.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="209.399" x2="203.399" y1="318.609" y2="318.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="77.8" x="17" y="335.143">JSON report</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="177.399" x="17" y="352.752">Counts / hashes or first error</text></g><!--entity html--><g class="entity" id="ent0004"><rect fill="#F1F1F1" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="243.213" x="531" y="298.609"/><polygon fill="#F1F1F1" points="757.213,303.609,757.213,317.609,769.213,317.609,769.213,309.609,763.213,303.609,757.213,303.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="763.213" x2="763.213" y1="303.609" y2="309.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="769.213" x2="763.213" y1="309.609" y2="309.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="112.841" x="541" y="326.143">Standalone HTML</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="213.213" x="541" y="343.752">Assignments / counts / differences</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="200.792" x="541" y="361.361">Partial evidence and diagnostics</text></g><!--entity gate--><g class="entity" id="ent0005"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="245.634" x="249.5" y="309.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="170.413" x="259.5" y="333.643">Gradle verification outcome</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="225.634" x="259.5" y="351.252">Fail for validation or report I/O errors</text></g><!--entity ci--><g class="entity" id="ent0006"><rect fill="#F1F5F9" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="248.758" x="99" y="473.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="87.158" x="109" y="498.143">CI automation</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="228.758" x="109" y="515.752">Normal tests AND coverage required</text></g><!--entity reviewer--><g class="entity" id="ent0007"><ellipse cx="555.645" cy="462.109" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M555.645,470.109 L555.645,497.109 M542.645,478.109 L568.645,478.109 M555.645,497.109 L542.645,512.109 M555.645,497.109 L568.645,512.109" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="58.352" x="472" y="528.143">Reviewer</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="167.289" x="472" y="545.752">Download or CI artifact link</text></g><g class="entity" id="ent0016"><path d="M674,469.609 L674,532.438 L966.585,532.438 L966.585,479.609 L956.585,469.609 L674,469.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M956.585,469.609 L956.585,479.609 L966.585,479.609 L956.585,469.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:1;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="205.42" x="680" y="489.143">No JavaScript or external assets.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="256.026" x="680" y="506.752">Unavailable evidence is not zero classes.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="271.585" x="680" y="524.361">Matching rows do not prove global success.</text></g><g class="entity" id="ent0019"><path d="M78.5,609.609 L78.5,654.828 A0,0 0 0 0 78.5,654.828 L368.761,654.828 A0,0 0 0 0 368.761,654.828 L368.761,619.609 L358.761,609.609 L227.5,609.609 L223.5,528.839 L219.5,609.609 L78.5,609.609 A0,0 0 0 0 78.5,609.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M358.761,609.609 L358.761,619.609 L368.761,619.609 L358.761,609.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="250.592" x="84.5" y="629.143">Selection coverage is not test execution.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="269.261" x="84.5" y="646.752">Publication cannot turn failure into success.</text></g><!--link inputs to snapshot--><g class="link" id="lnk8"><path d="M372.5,103.919 C372.5,127.039 372.5,154.479 372.5,177.199" fill="none" id="inputs-to-snapshot" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="372.5,182.199,376.5,173.199,372.5,177.199,368.5,173.199,372.5,182.199" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="179.013" x="373.5" y="149.143">read each expected file once</text></g><!--link snapshot to json--><g class="link" id="lnk9"><path d="M316.62,237.669 C273.33,258.229 218.046,284.504 173.996,305.434" fill="none" id="snapshot-to-json" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="169.48,307.579,179.326,307.33,173.996,305.434,175.892,300.104,169.48,307.579" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link snapshot to html--><g class="link" id="lnk10"><path d="M432.22,237.669 C472.14,255.409 520.621,276.968 564.671,296.558" fill="none" id="snapshot-to-html" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="569.24,298.589,562.642,291.277,564.671,296.558,559.391,298.587,569.24,298.589" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link snapshot to gate--><g class="link" id="lnk11"><path d="M372.5,237.819 C372.5,258.819 372.5,282.949 372.5,303.949" fill="none" id="snapshot-to-gate" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="372.5,308.949,376.5,299.949,372.5,303.949,368.5,299.949,372.5,308.949" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link json to ci--><g class="link" id="lnk12"><path d="M117.87,365.829 C123.27,383.379 131.72,405.899 143.5,423.609 C155.95,442.329 169.955,456.641 185.595,470.221" fill="none" id="json-to-ci" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="189.37,473.499,185.197,464.578,185.595,470.221,179.952,470.619,189.37,473.499" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="171.999" x="144.5" y="420.143">machine-readable evidence</text></g><!--link gate to ci--><g class="link" id="lnk13"><path d="M359.49,364.469 C350.1,382.319 336.32,405.689 320.5,423.609 C303.89,442.419 286.243,457.068 267.593,470.638" fill="none" id="gate-to-ci" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="263.55,473.579,273.181,471.519,267.593,470.638,268.474,465.05,263.55,473.579" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="108.951" x="335.5" y="420.143">required outcome</text></g><!--link html to reviewer--><g class="link" id="lnk14"><path d="M630.25,374.889 C616.32,398.219 600.823,424.186 585.943,449.106" fill="none" id="html-to-reviewer" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="583.38,453.399,591.428,447.723,585.943,449.106,584.56,443.621,583.38,453.399" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="170.413" x="610.5" y="420.143">consumer publish