ome.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="353.295" x="17" y="363.971">Dashed arrows: order only when both tasks are selected.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="278.585" x="17" y="381.58">Gray nodes are owned by the consumer / CI.</text></g></g></svg>
