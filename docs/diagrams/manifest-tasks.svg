<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="408px" preserveAspectRatio="none" style="width:1261px;height:408px;background:#FFFFFF;" version="1.1" viewBox="0 0 1261 408" width="1261px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="349.296" x="452.724" y="24.533">Optional manifest tasks: dependencies and ordering</text></g><!--entity compile--><g class="entity" id="ent0001"><rect fill="#F1F5F9" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="90.813" x="7" y="91.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="67.696" x="17" y="116.143">Source-set</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="70.813" x="17" y="133.752">compilation</text></g><!--entity prepare--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="117.269" x="284" y="45.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="94.944" x="294" y="70.143">prepare&lt;Task&gt;</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="97.269" x="294" y="87.752">ShardManifests</text></g><!--entity actual--><g class="entity" id="ent0003"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="149.179" x="268" y="135.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="76.248" x="278" y="160.143">write&lt;Task&gt;</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="129.179" x="278" y="177.752">ActualShardManifest</text></g><!--entity test--><g class="entity" id="ent0004"><rect fill="#F1F5F9" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="143.32" x="668.5" y="251.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLe