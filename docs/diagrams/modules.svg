<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="533px" preserveAspectRatio="none" style="width:747px;height:533px;background:#FFFFFF;" version="1.1" viewBox="0 0 747 533" width="747px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="297.958" x="221.448" y="24.533">ShardPilot: shared core and sibling adapters</text></g><!--entity core--><g class="entity" id="ent0001"><rect fill="#EFF6FF" height="90.438" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="243.31" x="451.5" y="237.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="92.6" x="461.5" y="262.143">shardpilot-core</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="223.31" x="461.5" y="279.752">History + assignment + XML refresh</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="165.737" x="461.5" y="297.361">YAML + coverage + HTML</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="112.055" x="461.5" y="314.971">No build-tool APIs</text></g><!--entity gradle--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="194.289" x="10.5" y="182.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="146.31" x="20.5" y="206.643">shardpilot-gradle-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="174.289" x="20.5" y="224.252">Test filters / process options</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="140.848" x="20.5" y="241.861">Managed artifact tasks</text></g><!--entity maven--><g class="entity" id="ent0003"><rect fill="#EFF6FF" height="90.438" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="200.558" x="7" y="331.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="149.413" x="17" y="356.143">shardpilot-maven-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="165.751" x="17" y="373.752">Native runner filter adapter</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="141.613" x="17" y="391.361">prepare / select / verify</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="180.558" x="17" y="408.971">Standalone refresh-durations</text></g><!--entity gradleJar--><g class="entity" id="ent0004"><rect fill="#F1F5F9" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.13" x="463.5" y="45.609"/><polygon fill="#F1F5F9" points="665.63,50.609,665.63,64.609,677.63,64.609,677.63,56.609,671.63,50.609,665.63,50.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="671.63" x2="671.63" y1="50.609" y2="56.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="677.63" x2="671.63" y1="56.609" y2="56.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="113.613" x="473.5" y="73.143">Gradle distribution</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="161.096" x="473.5" y="90.752">io.github.sjacek:shardpilot</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="189.13" x="473.5" y="108.361">Unchanged plugin ID and DSL</text></g><!--entity mavenJar--><g class="entity" id="ent0005"><rect fill="#F1F5F9" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="279.806" x="433" y="443.609"/><polygon fill="#F1F5F9" points="695.806,448.609,695.806,462.609,707.806,462.609,707.806,454.609,701.806,448.609,695.806,448.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="701.806" x2="701.806" y1="448.609" y2="454.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="707.806" x2="701.806" y1="454.609" y2="454.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="113.613" x="443" y="471.143">Maven distribution</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="249.806" x="443" y="488.752">io.github.sjacek:shardpilot-maven-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="241.247" x="443" y="506.361">Normal dependency on shardpilot-core</text></g><g class="entity" id="ent0011"><path d="M417,363.109 L417,408.328 A0,0 0 0 0 417,408.328 L729.074,408.328 A0,0 0 0 0 729.074,408.328 L729.074,373.109 L719.074,363.109 L577,363.109 L573,327.869 L569,363.109 L417,363.109 A0,0 0 0 0 417,363.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M719.074,363.109 L719.074,373.109 L729.074,373.109 L719.074,363.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="291.074" x="423" y="382.643">Java 17; original public Java package retained.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="286.392" x="423" y="400.252">One planner and one manifest/report contract.</text></g><g class="entity" id="ent0014"><path d="M413,157.109 L413,202.328 A0,0 0 0 0 413,202.328 L732.854,202.328 A0,0 0 0 0 732.854,202.328 L732.854,167.109 L722.854,157.109 L577,157.109 L573,121.889 L569,157.109 L413,157.109 A0,0 0 0 0 413,157.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M722.854,157.109 L722.854,167.109 L732.854,167.109 L722.854,157.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="243.537" x="419" y="176.643">Repository-root includeBuild still works.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="298.854" x="419" y="194.252">No separate core publication needed for Gradle.</text></g><!--link gradle to core--><g class="link" id="lnk6"><path d="M204.54,231.869 C276.13,241.759 369.447,254.646 446.357,265.256" fill="none" id="gradle-to-core" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="451.31,265.939,442.941,260.747,446.357,265.256,441.848,268.672,451.31,265.939" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="129.179" x="246" y="234.143">uses shared sources</text></g><!--link maven to core--><g class="link" id="lnk7"><path d="M208.22,356.389 C279.52,341.929 370.95,323.383 446.57,308.043" fill="none" id="maven-to-core" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="451.47,307.049,441.854,304.918,446.57,308.043,443.445,312.759,451.47,307.049" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="76.289" x="272.5" y="318.143">dependency</text></g><!--link gradle to gradleJar--><g class="link" id="lnk8"><path d="M204.54,190.639 C279.84,168.699 379.869,139.568 458.289,116.728" fill="none" id="gradle-to-gradleJar" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="463.09,115.329,453.331,114.006,458.289,116.728,455.568,121.687,463.09,115.329" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="130.737" x="245.5" y="136.143">bundles core classes</text></g><!--link maven to mavenJar--><g class="link" id="lnk9"><path d="M208.22,399.199 C273.8,414.059 355.684,432.605 428.024,448.995" fill="none" id="maven-to-mavenJar" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="432.9,450.099,425.006,444.21,428.024,448.995,423.239,452.012,432.9,450.099" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="143.972" x="239" y="405.143">native plugin descriptor</text></g></g>