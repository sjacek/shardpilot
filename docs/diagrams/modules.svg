<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="533px" preserveAspectRatio="none" style="width:745px;height:533px;background:#FFFFFF;" version="1.1" viewBox="0 0 745 533" width="745px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="297.958" x="220.448" y="24.533">ShardPilot: shared core and sibling adapters</text></g><!--entity core--><g class="entity" id="ent0001"><rect fill="#EFF6FF" height="90.438" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="185.737" x="478" y="237.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="92.6" x="488" y="262.143">shardpilot-core</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="131.106" x="488" y="279.752">History + assignment</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="165.737" x="488" y="297.361">YAML + coverage + HTML</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="112.055" x="488" y="314.971">No build-tool APIs</text></g><!--entity gradle--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="194.289" x="9.5" y="184.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="146.31" x="19.5" y="208.643">shardpilot-gradle-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="174.289" x="19.5" y="226.252">Test filters / process options</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="140.848" x="19.5" y="243.861">Managed artifact tasks</text></g><!--entity maven--><g class="entity" id="ent0003"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="198.972" x="7" y="337.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="149.413" x="17" y="361.643">shardpilot-maven-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="165.751" x="17" y="379.252">Native runner filter adapter</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="178.972" x="17" y="396.861">prepare / select / verify goals</text></g><!--entity gradleJar--><g class="entity" id="ent0004"><rect fill="#F1F5F9" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.13" x="461.5" y="45.609"/><polygon fill="#F1F5F9" points="663.63,50.609,663.63,64.609,675.63,64.609,675.63,56.609,669.63,50.609,663.63,50.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="669.63" x2="669.63" y1="50.609" y2="56.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="675.63" x2="669.63" y1="56.609" y2="56.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="113.613" x="471.5" y="73.143">Gradle distribution</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="161.096" x="471.5" y="90.752">io.github.sjacek:shardpilot</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="189.13" x="471.5" y="108.361">Unchanged plugin ID and DSL</text></g><!--entity mavenJar--><g class="entity" id="ent0005"><rect fill="#F1F5F9" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="279.806" x="431" y="443.609"/><polygon fill="#F1F5F9" points="693.806,448.609,693.806,462.609,705.806,462.609,705.806,454.609,699.806,448.609,693.806,448.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="699.806" x2="699.806" y1="448.609" y2="454.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="705.806" x2="699.806" y1="454.609" y2="454.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="113.613" x="441" y="471.143">Maven distribution</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="249.806" x="441" y="488.752">io.github.sjacek:shardpilot-maven-plugin</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="241.247" x="441" y="506.361">Normal dependency on shardpilot-core</text></g><g class="entity" id="ent0011"><path d="M415,363.109 L415,408.328 A0,0 0 0 0 415,408.328 L727.074,408.328 A0,0 0 0 0 727.074,408.328 L727.074,373.109 L717.074,363.109 L575,363.109 L571,327.869 L567,363.109 L415,363.109 A0,0 0 0 0 415,363.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M717.074,363.109 L717.074,373.109 L727.074,373.109 L717.074,363.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="291.074" x="421" y="382.643">Java 17; original public Java package retained.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="286.392" x="421" y="400.252">One planner and one manifest/report contract.</text></g><g class="entity" id="ent0014"><path d="M411,157.109 L411,202.328 A0,0 0 0 0 411,202.328 L730.854,202.328 A0,0 0 0 0 730.854,202.328 L730.854,167.109 L720.854,157.109 L575,157.109 L571,121.889 L567,157.109 L411,157.109 A0,0 0 0 0 411,157.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M720.854,157.109 L720.854,167.109 L730.854,167.109 L720.854,157.109" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="243.537" x="417" y="176.643">Repository-root includeBuild still works.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="298.854" x="417" y="194.252">No separate core publication needed for Gradle.</text></g><!--link gradle to core--><g class="link" id="lnk6"><path d="M203.61,233.489 C284.2,244.299 393.564,258.955 472.994,269.605" fill="none" id="gradle-to-core" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="477.95,270.269,469.561,265.109,472.994,269.605,468.498,273.038,477.95,270.269" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="129.179" x="244" y="236.143">uses shared sources</text></g><!--link maven to core--><g class="link" id="lnk7"><path d="M206.15,354.199 C286.54,338.379 394.304,317.174 472.894,301.714" fill="none" id="maven-to-core" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="477.8,300.749,468.197,298.562,472.894,301.714,469.741,306.411,477.8,300.749" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="76.289" x="270.5" y="317.143">dependency</text></g><!--link gradle to gradleJar--><g class="link" id="lnk8"><path d="M203.61,192.139 C278.78,169.879 378.486,140.34 456.666,117.18" fill="none" id="gradle-to-gradleJar" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="461.46,115.759,451.695,114.48,456.666,117.18,453.967,122.151,461.46,115.759" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="130.737" x="243.5" y="137.143">bundles core classes</text></g><!--link maven to mavenJar--><g class="link" id="lnk9"><path d="M206.15,396.649 C271.55,411.919 353.441,431.043 425.841,447.943" fill="none" id="maven-to-mavenJar" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="430.71,449.079,422.855,443.138,425.841,447.943,421.036,450.929,430.71,449.079" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="143.972" x="237" y="402.143">native plugin descriptor</text></g></g></svg>
