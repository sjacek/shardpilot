th="126.0752" x="650" y="434.1426">PrepareShardAction</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.5127" x="650" y="451.752">validate + log plan metadata</text></g><!--entity filter--><g class="entity" id="entity_filter"><rect fill="#EFF6FF" height="55.2188" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="213.0264" x="940.5" y="409.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.4756" x="950.5" y="434.1426">ShardClassFilter</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.0264" x="950.5" y="451.752">exclude non-owned candidates</text></g><!--entity history--><g class="entity" id="entity_history"><rect fill="#EFF6FF" height="55.2188" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="165.5303" x="835" y="567.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4756" x="845" y="592.1426">DurationHistory</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.5303" x="845" y="609.752">parse and validate TSV</text></g><!--entity plan--><g class="entity" id="entity_plan"><rect fill="#EFF6FF" height="55.2188" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="232.0713" x="1036" y="567.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.3789" x="1046" y="592.1426">ShardPlan</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.0713" x="1046" y="609.752">measured packing + hash fallback</text></g><g class="entity" id="entity_GMN26"><path d="M1009,685.6094 L1009,766.0469 A0,0 0 0 0 1009,766.0469 L1294.585,766.0469 A0,0 0 0 0 1294.585,766.0469 L1294.585,695.6094 L1284.585,685.6094 L1156,685.6094 L1152,622.7394 L1148,685.6094 L1009,685.6094 A0,0 0 0 0