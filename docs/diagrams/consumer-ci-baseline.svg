<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="906px" preserveAspectRatio="none" style="width:817px;height:906px;background:#FFFFFF;" version="1.1" viewBox="0 0 817 906" width="817px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="357.882" x="226.305" y="24.533">Accept a consumer policy against pinned CI evidence</text></g><!--entity ci--><g class="entity" id="ent0001"><rect fill="#F1F1F1" height="55.219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="232.071" x="148" y="45.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="168.096" x="158" y="70.143">Authenticated full CI cohort</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="212.071" x="158" y="87.752">project + pipeline + revision + jobs</text></g><!--entity artifacts--><g class="entity" id="ent0002"><rect fill="#F1F1F1" height="75.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="233.861" x="147" y="160.609"/><polygon fill="#F1F1F1" points="363.861,165.609,363.861,179.609,375.861,179.609,375.861,171.609,369.861,165.609,363.861,165.609" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="369.861" x2="369.861" y1="165.609" y2="171.609"/><line style="stroke:#181818;stroke-width:0.5;" x1="375.861" x2="369.861" y1="171.609" y2="171.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="145.503" x="157" y="188.143">Private original artifacts</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="203.861" x="157" y="205.752">compile ZIP, plans, actuals, XML</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="185.186" x="157" y="223.361">API reports, measured history</text></g><!--entity validate--><g class="entity" id="ent0003"><rect fill="#F1F1F1" height="82.828" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="209.647" x="159" y="296.609"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="348.647" y="301.609"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="346.647" y="303.609"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="346.647" y="307.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="146.303" x="174" y="331.143">Offline cohort validation</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="169.647" x="174" y="348.752">SHA-256, native ownership</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="150.186" x="174" y="366.361">complete disjoint shards</text></g><!--entity baseline--><g class="entity" id="ent0004"><rect fill="#F1F1F1" height="58.219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="244.409" x="7" y="440.109"/><polygon fill="#F1F1F1" points="234.409,445.109,234.409,459.109,246.409,459.109,246.409,451.109,240.409,445.109,234.409,445.109" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:0.5;" x1="240.409" x2="240.409" y1="445.109" y2="451.109"/><line style="stroke:#181818;stroke-width:0.5;" x1="246.409" x2="240.409" y1="451.109" y2="451.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="214.409" x="17" y="467.643">Accepted baseline + compiled tree</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="158.368" x="17" y="485.252">C3 retention seal + report</text></g><!--entity policy--><g class="entity" id="ent0005"><rect fill="#F1F1F1" height="58.219" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="250.992" x="546.5" y="440.109"/><polygon fill="#F1F1F1" points="780.492,445.109,780.492,459.109,792.492,459.109,792.492,451.109,786.4