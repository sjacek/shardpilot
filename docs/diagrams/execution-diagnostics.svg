<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="1101px" preserveAspectRatio="none" style="width:772px;height:1101px;background:#FFFFFF;" version="1.1" viewBox="0 0 772 1101" width="772px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="462.082" x="154.179" y="34.533">Optional diagnostics: native supervision and independent final check</text></g><ellipse cx="328.863" cy="63.609" fill="#222" rx="10" ry="10" style="stroke:#222;stroke-width:1;"/><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="397.405" x="130.16" y="93.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="377.405" x="140.16" y="118.143">Gradle prepareTaskDiagnostics / Maven prepare-diagnostics</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="325.261" x="140.16" y="135.752">Private expected settings; no tests or Docker access</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="218.406" x="219.659" y="168.828"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="198.406" x="229.659" y="193.361">External JDK DiagnosticsCli run</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="154.848" x="229.659" y="210.971">Fresh single-use session</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="229.344" x="214.191" y="294.852"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="209.344" x="224.191" y="319.385">Read daemon identity and ps --all</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="182.868" x="224.191" y="336.994">Initial daemon must be empty</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="193.551" x="232.087" y="420.875"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="147.082" x="242.087" y="445.408">Do not start native build</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="173.551" x="242.087" y="463.018">Retain failed initial evidence</text><ellipse cx="328.863" cy="507.094" fill="none" rx="11" ry="11" style="stroke:#222;stroke-width:1;"/><ellipse cx="328.863" cy="507.094" fill="#222" rx="6" ry="6" style="stroke:#222;stroke-width:1;"/><polygon fill="#EFF6FF" points="263.88,370.07,393.845,370.07,405.845,382.07,393.845,394.07,263.88,394.07,251.88,382.07,263.88,370.07" style="stroke:#2563EB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="15.572" x="332.863" y="408.604">no</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="129.965" x="263.88" y="387.799">Initial check passed?</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="21.786" x="405.845" y="378.994">yes</text><polygon fill="#EFF6FF" points="218.742,244.047,438.983,244.047,450.983,256.047,438.983,268.047,218.742,268.047,206.742,256.047,218.742,244.047" style="stroke:#2563EB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="21.786" x="332.863" y="282.58">yes</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="220.24" x="218.742" y="261.775">Dedicated Docker checks enabled?</text><polygon fill="#EFF6FF" points="328.863,560.094,340.863,572.094,328.863,584.094,316.863,572.094,328.863,560.094" style="stroke:#2563EB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="332.826" x="162.449" y="604.094"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="268.461" x="172.449" y="628.627">Supervise native Gradle / Maven command</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="312.826" x="172.449" y="646.236">Flush bounded process / job / DinD / host samples</text><polygon fill="#EFF6FF" points="274.394,679.313,383.331,679.313,395.331,691.313,383.331,703.313,274.394,703.313,262.394,691.313,274.394,679.313" style="stroke:#2563EB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="108.938" x="274.394" y="697.041">Runner survives?</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="21.786" x="240.608" y="688.236">yes</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="31.903" x="395.331" y="688.236">killed</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="312.599" x="16" y="713.313"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="251.344" x="26" y="737.846">Record native exit / timeout / interruption</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="292.599" x="26" y="755.455">Best-effort stop of owned processes on timeout</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="273.654" x="348.599" y="713.313"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="174.275" x="358.599" y="737.846">Partial samples may survive</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="253.654" x="358.599" y="755.455">Missing final process result is incomplete</text><polygon fill="#EFF6FF" points="328.863,774.531,340.863,786.531,328.863,798.531,316.863,786.531,328.863,774.531" style="stroke:#2563EB;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="264.385" x="196.67" y="818.531"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="244.385" x="206.67" y="843.064">Independent finish / adapter verification</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="201.517" x="206.67" y="860.674">Also callable from CI after_script</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="359.309" x="149.208" y="893.75"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="280.909" x="159.208" y="918.283">Recheck identity, process result and samples</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="339.309" x="159.208" y="935.893">Read-only final ps --all on the same dedicated daemon</text><path d="M511.772,958.969 L511.772,995.188 L491.772,999.188 L511.772,1003.188 L511.772,1039.406 A0,0 0 0 0 511.772,1039.406 L751.44,1039.406 A0,0 0 0 0 751.44,1039.406 L751.44,968.969 L741.44,958.969 L511.772,958.969 A0,0 0 0 0 511.772,958.969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M741.44,958.969 L741.44,968.969 L751.44,968.969 L741.44,958.969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="206.233" x="517.772" y="978.502">No container creation or deletion.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="185.179" x="517.772" y="996.111">Unknown memory is not zero.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="218.668" x="517.772" y="1013.721">Exit 137 alone is not proof of OOM.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="188.33" x="517.772" y="1031.33">Preserve native and C2 gates.</text><rect fill="#EFF6FF" height="55.219" rx="12.5" ry="12.5" style="stroke:#2563EB;stroke-width:0.5;" width="325.819" x="165.953" y="971.578"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="207.724" x="175.953" y="996.111">Write matching HTML then JSON</text><text fill="#000" font-size="14" lengthAdju