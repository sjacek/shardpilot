<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="1020px" preserveAspectRatio="none" style="width:896px;height:1020px;background:#FFFFFF;" version="1.1" viewBox="0 0 896 1020" width="896px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="362.537" x="263.619" y="24.533">ShardPilot: Gradle first, Maven later from the same tag</text></g><!--cluster Required checks at the exact commit SHA - no release secrets--><g class="cluster" id="ent0004"><path d="M115.5,299.609 L531.229,299.609 A3.75,3.75 0 0 1 533.729,302.109 L540.729,323.219 L760.5,323.219 A2.5,2.5 0 0 1 763,325.719 L763,422.109 A2.5,2.5 0 0 1 760.5,424.609 L115.5,424.609 A2.5,2.5 0 0 1 113,422.109 L113,302.109 A2.5,2.5 0 0 1 115.5,299.609" fill="none" style="stroke:#000;stroke-width:1.5;"/><line style="stroke:#000;stroke-width:1.5;" x1="113" x2="540.729" y1="323.219" y2="323.219"/><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="414.729" x="117" y="316.143">Required checks at the exact commit SHA - no release secrets</text></g><!--entity gradleChecks--><g class="entity" id="ent0005"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="143.71" x="129" y="344.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="123.71" x="139" y="369.143">8 Gradle / JDK cells</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="112.444" x="139" y="386.752">check + assemble</text></g><!--entity mavenChecks--><g class="entity" id="ent0006"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="155.775" x="308" y="344.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="121.386" x="318" y="369.143">3 Maven / JDK jobs</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="135.775" x="318" y="386.752">verify + native fixtures</text></g><!--entity bundle--><g class="entity" id="ent0007"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="247.213" x="499.5" y="335.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="175.896" x="509.5" y="360.143">Signed Maven bundle check</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="164.22" x="509.5" y="377.752">Disposable key; no upload</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="227.213" x="509.5" y="395.361">9 artifacts + signatures + checksums</text></g><!--entity tag--><g class="entity" id="ent0001"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="234.785" x="129.5" y="54.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="214.785" x="139.5" y="79.143">Push a new immutable release tag</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="178.985" x="139.5" y="96.752">Automatic Gradle publication</text></g><!--entity manual--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="253.434" x="399.5" y="45.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="199.985" x="409.5" y="70.143">Later: manual workflow dispatch</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="233.434" x="409.5" y="87.752">Select the same existing tag with --ref</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="161.868" x="409.5" y="105.361">Maven Central publication</text></g><!--entity validate--><g class="entity" id="ent0003"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="237.889" x="267" y="179.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="104.282" x="277" y="204.143">Require a tag ref</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="217.889" x="277" y="221.752">Tag equals Gradle / Maven version</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="199.951" x="277" y="239.361">Check out its exact commit SHA</text></g><!--entity gate--><g class="entity" id="ent0008"><rect fill="#DCFCE7" height="37.609" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="135.944" x="318" y="471.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="115.944" x="328" y="496.143">All 12 checks pass</text></g><!--entity gradlePublish--><g class="entity" id="ent0009"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="221.558" x="7" y="592.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="201.558" x="17" y="616.643">gradle-plugin-portal environment</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="108.165" x="17" y="634.252">Portal credentials</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="156.83" x="17" y="651.861">Validate + publishPlugins</text></g><!--entity mavenPublish--><g class="entity" id="ent0010"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="242.961" x="264.5" y="592.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="169.634" x="274.5" y="616.643">maven-central environment</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="210.123" x="274.5" y="634.252">Upload once; save deployment ID</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="222.961" x="274.5" y="651.861">central-release / waitUntil=uploaded</text></g><!--entity status--><g class="entity" id="ent0011"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="248.785" x="258.5" y="752.609"/><text fill="#000" font-