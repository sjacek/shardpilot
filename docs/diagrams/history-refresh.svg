<svg xmlns="http://www.w3.org/2000/svg" contentStyleType="text/css" height="283px" preserveAspectRatio="none" style="width:1845px;height:283px;background:#FFFFFF;" version="1.1" viewBox="0 0 1845 283" width="1845px" zoomAndPan="magnify"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif"><g class="title"><text fill="#000" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="308.868" x="764.603" y="24.533">Duration refresh: evidence to reviewed history</text></g><!--entity ci--><g class="entity" id="ent0001"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="173.296" x="7" y="115.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="134.62" x="17" y="140.143">CI collects one cohort</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="153.296" x="17" y="157.752">Project + suite + revision</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="140.075" x="17" y="175.361">Keep shard directories</text></g><!--entity inputs--><g class="entity" id="ent0002"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="198.992" x="241" y="115.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="124.462" x="251" y="140.143">Existing TEST-*.xml</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="178.992" x="251" y="157.752">Eligibility baseline / bytecode</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="153.282" x="251" y="175.361">Immutable previous TSV</text></g><!--entity adapter--><g class="entity" id="ent0003"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="188.116" x="557" y="115.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="119.048" x="567" y="140.143">Gradle refresh task</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="161.109" x="567" y="157.752">or Maven standalone goal</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="168.116" x="567" y="175.361">No producer dependencies</text></g><!--entity core--><g class="entity" id="ent0004"><rect fill="#EFF6FF" height="90.438" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="183.42" x="862" y="107.109"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="76.269" x="872" y="131.643">Shared core</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="139.296" x="872" y="149.252">Secure XML metadata</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="147.048" x="872" y="166.861">Complete class families</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="163.42" x="872" y="184.471">Prune, merge, floor, round</text></g><!--entity success--><g class="entity" id="ent0005"><rect fill="#EFF6FF" height="55.219" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="171.744" x="1270.5" y="54.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="147.089" x="1280.5" y="79.143">Candidate durations.tsv</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="151.744" x="1280.5" y="96.752">durations.json: PASSED</text></g><!--entity failure--><g class="entity" id="ent0006"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="201.316" x="1256" y="144.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="143.958" x="1266" y="169.143">durations.json: FAILED</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="181.316" x="1266" y="186.752">Remove stale candidate TSV</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="90.262" x="1266" y="204.361">Fail task / goal</text></g><!--entity review--><g class="entity" id="ent0007"><rect fill="#EFF6FF" height="72.828" rx="2.5" ry="2.5" style="stroke:#2563EB;stroke-width:0.5;" width="222.357" x="1563" y="45.609"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="89.476" x="1573" y="70.143">Human review</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="143.172" x="1573" y="87.752">Adopt in a later commit</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="202.357" x="1573" y="105.361">Next pipeline uses one snapshot</text></g><g class="entity" id="ent0015"><path d="M501,223.609 L501,268.828 A0,0 0 0 0 501,268.828 L800.551,268.828 A0,0 0 0 0 800.551,268.828 L800.551,233.609 L790.551,223.609 L655,223.609 L651,188.839 L647,223.609 L501,223.609 A0,0 0 0 0 501,223.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M790.551,223.609 L790.551,233.609 L800.551,233.609 L790.551,223.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="263.819" x="507" y="243.143">Invalid configuration: reject before parsing.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="278.551" x="507" y="260.752">I/O errors fail the build; writes are not atomic.</text></g><g class="entity" id="ent0018"><path d="M1518,153.609 L1518,216.438 A0,0 0 0 0 1518,216.438 L1830.074,216.438 A0,0 0 0 0 1830.074,216.438 L1830.074,163.609 L1820.074,153.609 L1678,153.609 L1674,118.829 L1670,153.609 L1518,153.609 A0,0 0 0 0 1518,153.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><path d="M1820.074,153.609 L1820.074,163.609 L1830.074,163.609 L1820.074,153.609" fill="#FFFBEB" style="stroke:#D97706;stroke-width:0.5;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="291.074" x="1524" y="173.143">Keep native test and selection-coverage gates.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="285.585" x="1524" y="190.752">Recorded loads are not wall-clock predictions.</text><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="277.006" x="1524" y="208.361">Refresh never overwrites maintained history.</text></g><!--link ci to inputs--><g class="link" id="lnk8"><path d="M180.19,152.109 C199.78,152.109 215.76,152.109 235.85,152.109" fill="none" id="ci-to-inputs" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="240.85,152.109,231.85,148.109,235.85,152.109,231.85,156.109,240.85,152.109" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link inputs to adapter--><g class="link" id="lnk9"><path d="M440.38,152.109 C477.75,152.109 515.11,152.109 551.92,152.109" fill="none" id="inputs-to-adapter" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="556.92,152.109,547.92,148.109,551.92,152.109,547.92,156.109,556.92,152.109" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link adapter to core--><g class="link" id="lnk10"><path d="M745.02,152.109 C782.25,152.109 820,152.109 856.98,152.109" fill="none" id="adapter-to-core" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="861.98,152.109,852.98,148.109,856.98,152.109,852.98,156.109,861.98,152.109" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link core to success--><g class="link" id="lnk11"><path d="M1045.49,136.229 C1112.97,124.449 1199.385,109.359 1265.425,97.829" fill="none" id="core-to-success" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="1270.35,96.969,1260.796,94.577,1265.425,97.829,1262.172,102.458,1270.35,96.969" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="118.303" x="1091.5" y="101.643">Accepted evidence</text></g><!--link core to failure--><g class="link" id="lnk12"><path d="M1045.27,161.529 C1055.29,162.459 1065.36,163.339 1075,164.109 C1134.94,168.909 1197.188,172.752 1250.808,175.732" fill="none" id="core-to-failure" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="1255.8,176.009,1247.036,171.516,1250.808,175.732,1246.592,179.504,1255.8,176.009" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000" font-size="14" lengthAdjust="spacing" textLength="149.42" x="1076" y="160.643">Invalid / insufficient data</text></g><!--link success to review--><g class="link" id="lnk13"><path d="M1442.88,82.109 C1479.83,82.109 1518.55,82.109 1557.91,82.109" fill="none" id="success-to-review" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="1562.91,82.109,1553.91,78.109,1557.91,82.109,1553.91,86.109,1562.91,82.109" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g></svg>
