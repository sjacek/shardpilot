plugins {
    id 'java'
    id 'groovy'
    id 'org.gradle.test-retry' version '1.6.6'
}
repositories { mavenCentral() }
dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.spockframework:spock-core:2.5-groovy-5.0'
    testImplementation 'org.apache.groovy:groovy:5.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
test {
    useJUnitPlatform()
    maxHeapSize = '256m'
    maxParallelForks = 1
    retry { maxRetries = 1 }
    reports.junitXml.mergeReruns = providers.gradleProperty('mergeReruns').get().toBoolean()
    systemProperty 'spike.attempts', layout.buildDirectory.file('attempts.txt').get().asFile.absolutePath
}
