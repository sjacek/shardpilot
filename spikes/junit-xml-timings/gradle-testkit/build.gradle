plugins { id 'java' }
repositories { mavenCentral() }

dependencies {
    testImplementation gradleTestKit()
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }
test {
    useJUnitPlatform()
    inputs.dir('fixture').withPropertyName('timingFixtureTemplates')
    maxHeapSize = '256m'
    maxParallelForks = 1
    systemProperty 'spike.fixtureRoot', layout.projectDirectory.dir('fixture').asFile.absolutePath
    systemProperty 'spike.outputRoot', layout.buildDirectory.dir('probes').get().asFile.absolutePath
    testLogging { exceptionFormat = 'full' }
}
