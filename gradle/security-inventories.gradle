import groovy.json.JsonOutput
import org.gradle.api.artifacts.Configuration
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.specs.Spec
import java.security.MessageDigest

// Producer inventories are opt-in verification tasks. They never change published dependencies.
apply plugin: 'org.cyclonedx.bom'
// Applied scripts do not inherit the plugins{} script's compile classpath.
Class<? extends Task> cyclonedxTask = rootProject.buildscript.classLoader
        .loadClass('org.cyclonedx.gradle.CyclonedxDirectTask').asSubclass(Task)
def cyclonedxVersion = rootProject.buildscript.classLoader.loadClass('org.cyclonedx.Version')

def inventories = tasks.register('securityInventories') {
    group = 'verification'
    description = 'Resolve separate runtime, build, test and provided security inventories.'
    dependsOn ':shardpilot-gradle-plugin:jar', ':shardpilot-core:cyclonedxDirectBom',
            ':shardpilot-gradle-plugin:cyclonedxDirectBom'
}

gradle.projectsEvaluated {
    allprojects { owner ->
        // compileOnly is declarative, so resolve a dedicated, non-consumable view of that scope.
        def compileOnly = owner.configurations.names.contains('compileOnly')
                ? owner.configurations.named('compileOnly') : null
        def provided = owner.configurations.resolvable('securityProvidedClasspath') {
            if (compileOnly != null) extendsFrom compileOnly.get()
        }
        def scopes = [build: ['classpath'],
                      test: ['testCompileClasspath', 'testRuntimeClasspath',
                             'execution.*FixtureCompileClasspath', 'execution.*FixtureRuntimeClasspath',
                             'verificationFixtures'],
                      provided: [provided.name]]
        scopes.each { scope, patterns ->
            String bomTaskName = "security${scope.capitalize()}Bom"
            def bomTask = owner.tasks.register(bomTaskName, cyclonedxTask)
            bomTask.configure {
                includeConfigs = patterns
                includeBuildEnvironment = scope == 'build'
                schemaVersion = cyclonedxVersion.VERSION_16
                jsonOutput = owner.layout.buildDirectory.file("reports/security/gradle/${scope}/bom.raw.json")
                xmlOutput.convention((RegularFile) null)
            }
            String evidenceTaskName = "security${scope.capitalize()}Inputs"
            def evidence = owner.tasks.register(evidenceTaskName) {
                dependsOn bomTask
                notCompatibleWithConfigurationCache('Opt-in producer inventory records resolved configuration provenance.')
                def destination = owner.layout.buildDirectory.file("reports/security/gradle/${scope}/inputs.json")
                outputs.file(destination)
                // Re-resolve the current model; stale metadata must not describe another build/JDK.
                outputs.upToDateWhen { false }
                doLast {
                    // Filter names before realizing the selected configurations for this opt-in task.
                    def selected = owner.configurations.named({ String name ->
                        patterns.any { name.matches(it) }
                    } as Spec<String>).stream().filter { Configuration configuration ->
                        configuration.canBeResolved
                    }.toList()
                    if (scope == 'build') {
                        selected += owner.buildscript.configurations.named({ String name ->
                            name == 'classpath'
                        } as Spec<String>).stream().filter { Configuration configuration ->
                            configuration.canBeResolved
                        }.toList()
                    }
                    // Native CycloneDX models repository modules. Gradle API/TestKit file dependencies
                    // need separate identities: never invent Maven coordinates for distribution JARs.
                    def sdkConfigurations = scope == 'provided'
                            ? (owner.configurations.names.contains('compileClasspath')
                               ? [owner.configurations.named('compileClasspath').get()] : [])
                            : (scope == 'test' ? selected : [])
                    def localArtifacts = [:]
                    sdkConfigurations.each { configuration ->
                        configuration.incoming.artifacts.artifacts.each { artifact ->
                            if (!(artifact.id.componentIdentifier instanceof ModuleComponentIdentifier)) {
                                File file = artifact.file
                                if (file.isFile()) {
                                    def sdk = file.toPath().startsWith(gradle.gradleHomeDir.toPath()) ||
                                            (file.name in ["gradle-api-${gradle.gradleVersion}.jar".toString(),
                                                           "gradle-test-kit-${gradle.gradleVersion}.jar".toString()] &&
                                             file.toPath().startsWith(gradle.gradleUserHomeDir.toPath()))
                                    if (!sdk) {
                                        throw new GradleException("Unclassified local dependency: ${file.name}")
                                    }
                                    def digest = MessageDigest.getInstance('SHA-256')
                                    file.withInputStream { input ->
                                        byte[] buffer = new byte[65536]
                                        int count
                                        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                                    }
                                    def checksum = digest.digest().encodeHex().toString()
                                    if (localArtifacts.containsKey(file.name) && localArtifacts[file.name].sha256 != checksum) {
                                        throw new GradleException("Conflicting SDK artifact bytes: ${file.name}")
                                    }
                                    localArtifacts[file.name] = [name: file.name, version: gradle.gradleVersion,
                                            sha256: checksum,
                                            configuration: configuration.name]
                                }
                            }
                        }
                    }
                    File output = destination.get().asFile
                    output.parentFile.mkdirs()
                    output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                            schemaVersion: 1, project: owner.path, scope: scope,
                            configurations: selected.collect { it.name }.unique().sort(),
                            gradleVersion: gradle.gradleVersion,
                            localArtifacts: localArtifacts.values().sort { it.name }])), 'UTF-8')
                }
            }
            inventories.configure { dependsOn evidence }
        }
    }
}
