// These are download-only inputs for isolated TestKit consumers, never plugin runtime dependencies.
// Keeping them resolvable here lets Gradle's native metadata writer maintain one reviewed policy.
repositories { mavenCentral() }
configurations {
    verificationFixtures {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    verificationFixtures platform('org.junit:junit-bom:6.1.3')
    verificationFixtures 'org.junit.jupiter:junit-jupiter'
    verificationFixtures 'org.junit.platform:junit-platform-launcher'
    verificationFixtures 'org.testng:testng:7.12.0'
    verificationFixtures 'org.spockframework:spock-core:2.5-groovy-5.0'
    verificationFixtures 'org.apache.groovy:groovy:5.1.3'
    // GroovyCompile infers a detached compiler classpath (Ant and compiler modules) at execution time.
    verificationFixtures 'org.apache.groovy:groovy-all:5.1.3'
    verificationFixtures 'org.apache.groovy:groovy-astbuilder:5.1.3'
    verificationFixtures 'org.apache.groovy:groovy-dateutil:5.1.3'
}
