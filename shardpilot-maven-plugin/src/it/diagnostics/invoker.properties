# The first native build resolves its runtime; retained-evidence checks run offline afterwards.
invoker.goals.1 = test-compile shardpilot:prepare-diagnostics surefire:test
invoker.goals.2 = shardpilot:verify-diagnostics -o
invoker.goals.3 = shardpilot:verify-diagnostics -o -Dshardpilot.diagnosticsAttempt=2
invoker.buildResult.3 = failure
invoker.goals.4 = shardpilot:prepare-diagnostics surefire:test -o -Ddiagnostics.case=failed
invoker.goals.5 = shardpilot:verify-diagnostics -o -Ddiagnostics.case=failed
invoker.buildResult.5 = failure
invoker.goals.6 = shardpilot:verify-diagnostics -o
# Rejected preparation must not replace the valid expected settings or rerun native producers.
invoker.goals.7 = shardpilot:prepare-diagnostics -o -Dshardpilot.diagnosticsMaxSamples=0
invoker.buildResult.7 = failure
invoker.goals.8 = shardpilot:verify-diagnostics -o
