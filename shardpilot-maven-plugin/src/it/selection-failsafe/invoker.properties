# Keep native outcomes and XML separate for one-node and two-node selections.
invoker.goals.1 = test-compile shardpilot:prepare
invoker.goals.2 = verify
invoker.goals.3 = shardpilot:verify
invoker.goals.4 = shardpilot:prepare -Dshardpilot.count=2
invoker.goals.5 = verify -Dshardpilot.count=2 -Dshardpilot.index=1
invoker.goals.6 = verify -Dshardpilot.count=2 -Dshardpilot.index=2
invoker.goals.7 = shardpilot:verify -Dshardpilot.count=2
# Failsafe's own focused property must be rejected before its integration-test/verify bindings run.
invoker.goals.8 = verify -Dshardpilot.count=2 -Dshardpilot.index=2 -Dit.test=AlphaIT
invoker.buildResult.8 = failure
