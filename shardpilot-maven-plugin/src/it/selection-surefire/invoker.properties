# Keep native outcomes and XML separate for one-node and two-node selections.
invoker.goals.1 = test-compile shardpilot:prepare
invoker.goals.2 = test
invoker.goals.3 = shardpilot:verify
invoker.goals.4 = shardpilot:prepare -Dshardpilot.count=2
invoker.goals.5 = test -Dshardpilot.count=2 -Dshardpilot.index=1
invoker.goals.6 = test -Dshardpilot.count=2 -Dshardpilot.index=2
invoker.goals.7 = shardpilot:verify -Dshardpilot.count=2
# Focused native runs must fail before replacing the already verified second-node evidence/XML.
invoker.goals.8 = test -Dshardpilot.count=2 -Dshardpilot.index=2 -Dtest=AlphaTest
invoker.buildResult.8 = failure
