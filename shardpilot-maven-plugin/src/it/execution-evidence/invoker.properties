# Resolve the reviewed plugin/POM graph once in Invoker's isolated repository. No lifecycle is run.
# Subsequent calls must work offline even when this fixture is selected without earlier native projects.
invoker.goals.1 = shardpilot:verify-executions
invoker.goals.2 = shardpilot:verify-executions -o -Dexecution.case=failsafe
invoker.goals.3 = shardpilot:verify-executions -o -Dexecution.case=native-failed
invoker.buildResult.3 = failure
# Reuse successful output names: a missing producer must replace them with FAILED reports.
invoker.goals.4 = shardpilot:verify-executions -o -Dexecution.case=missing -Dexecution.outputCase=surefire
invoker.buildResult.4 = failure
