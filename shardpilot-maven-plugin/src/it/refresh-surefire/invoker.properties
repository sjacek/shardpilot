# Refresh is deliberately invoked standalone, never bound to test/verify.
invoker.goals.1 = test-compile shardpilot:prepare -Dshardpilot.count=2
invoker.goals.2 = test -Dshardpilot.count=2 -Dshardpilot.index=1
invoker.goals.3 = test -Dshardpilot.count=2 -Dshardpilot.index=2
invoker.goals.4 = shardpilot:refresh-durations -Dshardpilot.count=2 -Dshardpilot.precision=3 -Dshardpilot.minimumSeconds=0.001 -Dshardpilot.minimumCoverage=0.6
# invoker.goals splits on commas; keep the multi-root property in a Maven profile.
invoker.profiles.5 = collected
invoker.goals.5 = shardpilot:refresh-durations -Dshardpilot.count=2 -Dshardpilot.precision=3 -Dshardpilot.minimumSeconds=0.001 -Dshardpilot.minimumCoverage=0.6 -Dshardpilot.outputFile=target/collected.tsv -Dshardpilot.reportFile=target/collected.json
invoker.goals.6 = shardpilot:refresh-durations -Dshardpilot.pruning=DISABLED -Dshardpilot.outputFile=target/unpruned.tsv -Dshardpilot.reportFile=target/unpruned.json
# Two measured families out of three must fail a full-coverage gate and leave FAILED JSON.
invoker.goals.7 = shardpilot:refresh-durations -Dshardpilot.minimumCoverage=1 -Dshardpilot.outputFile=target/rejected.tsv -Dshardpilot.reportFile=target/rejected.json
invoker.buildResult.7 = failure
# A configuration error must preserve the successful default TSV/JSON from invocation four.
invoker.goals.8 = shardpilot:refresh-durations -Dshardpilot.pruning=DISABLED -Dshardpilot.minimumCoverage=1
invoker.buildResult.8 = failure
