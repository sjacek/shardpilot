name: Publish ShardPilot
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Maven Central' || 'Gradle Plugin Portal' }} / ${{ github.ref_name }}"

on:
  push:
    tags: ['v[0-9]*']
  # Select the existing release tag as the workflow ref to publish Maven later.
  workflow_dispatch:
    inputs:
      maven_deployment_id:
        description: 'Resume an accepted Central deployment without uploading again (optional UUID)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never interrupt a publication that may already have uploaded immutable artifacts.
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Verify release tag and build version
    # Tag pushes publish Gradle; manual runs publish Maven from the selected existing tag.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == true && github.event.deleted == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a tag reference
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" != 'tag' ]]; then
            echo '::error::Select an existing release tag (for example v0.3.1) as the workflow ref.'
            exit 1
          fi
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Validate the stable version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash ./gradlew verifyReleaseTag -PreleaseTag="$RELEASE_TAG" --console=plain

  compatibility:
    name: Complete compatibility matrix
    needs: validate-tag
    # A local reusable workflow runs at the same commit as this caller, without release secrets.
    uses: ./.github/workflows/compatibility.yml

  publish:
    name: Publish to Gradle Plugin Portal
    needs: [validate-tag, compatibility]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gradle-plugin-portal
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle without shared caches
        uses: gradle/actions/setup-gradle@v6
        with:
          # Do not restore untrusted build state or save state from a credentialed build.
          cache-disabled: true
      - name: Validate and publish the plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GRADLE_PUBLISH_KEY:-}" || -z "${GRADLE_PUBLISH_SECRET:-}" ]]; then
            echo '::error::Configure GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET in the gradle-plugin-portal environment.'
            exit 1
          fi
          bash ./gradlew publishPlugins --validate-only --no-configuration-cache --no-daemon --console=plain
          bash ./gradlew publishPlugins --no-configuration-cache --no-daemon --console=plain

  publish-maven:
    name: Publish to Maven Central
    needs: [validate-tag, compatibility]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Java and isolated Central settings
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          settings-path: ${{ runner.temp }}/shardpilot-maven
      - name: Set up Python for resilient Central status polling
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish the signed Maven release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_DEPLOYMENT_ID: ${{ inputs.maven_deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/central_publication.py \
            --settings "$RUNNER_TEMP/shardpilot-maven/settings.xml"
      - name: Retain Central deployment identity and status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-publication-${{ github.ref_name }}
          path: build/central-publication/state.json
          if-no-files-found: warn
          retention-days: 30
