name: Build tool and JDK compatibility

on:
  push:
    # Release tags call this workflow from publish.yml instead of starting a second matrix.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Separate downloaded artifacts from fixture projects, test results and publisher state.
env:
  GRADLE_USER_HOME: ${{ github.workspace }}/build/ci-dependencies/gradle
  SHARDPILOT_TESTKIT_DIR: ${{ github.workspace }}/build/ci-dependencies/testkit
  MAVEN_USER_HOME: ${{ github.workspace }}/build/ci-dependencies/maven-user-home

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    name: Prepare dependency cache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the warmup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          # JDK 21 can run all three consumer distributions, including Gradle 9.0.0.
          distribution: temurin
          java-version: '21'
      - name: Set up Python for dependency snapshots
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify immutable build inputs
        run: python3 -B scripts/dependency_policy.py
      - name: Verify published artifact audit guards
        run: python3 -B -m unittest discover -s testing/published-artifacts -p 'test_*.py' -v
      - name: Enable Maven dependency verification
        run: python3 -B scripts/maven_verification.py prepare
      - name: Restore downloaded dependencies
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        # restore/action.yml at v5 defines these inputs; older IDE action metadata may lag.
        with:
          # noinspection UndefinedParamsPresent
          path: |
            build/gradle-dependencies.tar
            build/maven-dependencies.tar
          # noinspection UndefinedParamsPresent
          key: ci-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle', '**/pom.xml', 'gradle.properties', '**/gradle-wrapper.properties', '.mvn/wrapper/maven-wrapper.properties', '.mvn/checksums.sha256', 'gradle/verification-metadata.xml', 'gradle/ide-source-availability.json', 'scripts/ide_dependency*', 'security/dependency-verification.json', 'security/maven-tooling-scope.json', 'build-logic/maven-tooling-guard/**', 'scripts/maven_tooling.py', 'shardpilot-gradle-plugin/src/test/**/*.java', 'scripts/ci_dependency_cache.py', 'scripts/maven_verification.py', 'scripts/maven_security_inventory.py', '.github/workflows/compatibility.yml') }}
          # noinspection UndefinedParamsPresent
          restore-keys: ci-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Unpack downloaded dependencies
        run: python3 -B scripts/ci_dependency_cache.py restore
      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          # One download-only snapshot owns these paths; do not layer a second Gradle cache over it.
          cache-disabled: true
      - name: Verify IDE source and Gradle SDK checksums
        run: python3 -B scripts/ide_dependency_verification.py check --verify-downloads
      - name: Test IDE dependency update safeguards
        run: python3 -B -m unittest discover -s scripts -p 'test_ide_dependency_verification.py' -v
      - name: Warm Gradle and TestKit dependencies without running tests
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: >-
          bash ./gradlew :shardpilot-gradle-plugin:warmTestKitCache
          securityInventories --no-configuration-cache
          -PtestGradleVersions=9.0.0,9.1.0,9.9.1 --stacktrace --console=plain
      - name: Warm Maven reactor and native fixture dependencies without running tests
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python3 -B scripts/ci_dependency_cache.py warm-maven
      - name: Verify dependency snapshot handling
        run: python3 -B -m unittest discover -s scripts -p 'test_ci_dependency_cache.py' -v
      - name: Verify dependency policy and verifier bootstrap failures
        run: python3 -B -m unittest discover -s scripts -p 'test_dependency*.py' -v
      - name: Verify native Maven checksum rejection
        run: python3 -B scripts/verify_dependency_rejection.py
      - name: Verify native Maven tooling restrictions
        run: python3 -B scripts/verify_maven_tooling.py
      - name: Verify Maven tooling scope policy
        run: python3 -B -m unittest discover -s scripts -p 'test_maven_tooling.py' -v
      - name: Retain dependency verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-verification
          path: |
            build/dependency-verification/native-rejection.json
            build/dependency-verification/*-native-checksum.log
            build/dependency-verification/tooling-guard-native.json
            build/dependency-verification/tooling-guard-native-*.log
            **/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14
      - name: Pack downloaded dependencies only
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: python3 -B scripts/ci_dependency_cache.py pack
      - name: Save downloaded dependencies from the default branch
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        # save/action.yml at v5 defines both inputs; suppress only these known parameters.
        with:
          # noinspection UndefinedParamsPresent
          path: |
            build/gradle-dependencies.tar
            build/maven-dependencies.tar
          # noinspection UndefinedParamsPresent
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Share warmed Gradle dependencies with this run
        # Same-run artifacts also work on PRs/forks that cannot write the default branch cache.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-dependencies
          path: build/gradle-dependencies.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Share warmed Maven dependencies with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maven-dependencies
          path: build/maven-dependencies.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  dependency-security:
    name: Check runtime dependencies
    needs: warm-cache
    uses: ./.github/workflows/security.yml
    with:
      warmed-dependencies: true

  compatibility:
    name: Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    # Tests and security scans share downloads, but report independent required results.
    needs: warm-cache
    # A failed warmup must fail required checks, not silently skip them as successful statuses.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep all results even if one supported runtime regresses.
      fail-fast: false
      matrix:
        gradle: ['9.0.0', '9.1.0', '9.9.1']
        java: ['17', '21', '25']
        exclude:
          # Running Gradle on JDK 25 is supported starting with Gradle 9.1.0.
          - gradle: '9.0.0'
            java: '25'
    steps:
      - name: Require successful dependency warmup
        if: needs.warm-cache.result != 'success'
        run: |
          echo '::error::Dependency warmup failed; compatibility tests cannot be skipped.'
          exit 1
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the matrix JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-disabled: true
      - name: Download warmed dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # action.yml at v7 defines name/path; retain validation elsewhere in this workflow.
        with:
          # noinspection UndefinedParamsPresent
          name: gradle-dependencies
          # noinspection UndefinedParamsPresent
          path: build
      - name: Unpack downloaded dependencies
        run: python3 -B scripts/ci_dependency_cache.py restore gradle
      - name: Verify the plugin against the consumer runtime
        # The Wrapper builds the plugin; each TestKit consumer uses matrix.gradle and the selected JDK.
        # Invoke through Bash because Windows checkouts may track gradlew without its executable bit.
        run: >-
          bash ./gradlew check assemble
          -PtestGradleVersion=${{ matrix.gradle }} -PtestJavaVersion=${{ matrix.java }}
          --stacktrace --console=plain
      - name: Retain test and validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: |
            shardpilot-gradle-plugin/build/reports/
            shardpilot-gradle-plugin/build/test-results/test/
            shardpilot-core/build/reports/
            shardpilot-core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  release-artifacts:
    name: Signed Maven release bundle (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Java for release verification
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Python for publication recovery tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Enable Maven dependency verification
        run: python3 -B scripts/maven_verification.py prepare
      - name: Verify the signed release with a disposable key
        run: bash scripts/verify-maven-release.sh
      - name: Verify resilient Central status polling without publication credentials
        # Unit and loopback HTTP tests never contact Central or run a real Maven upload.
        run: python3 -B -m unittest discover -s scripts -p 'test_central_publication*.py' -v
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-signed-maven-release
          # The disposable private key lives only in a temporary directory and is never uploaded.
          path: build/release-verification/report.json
          if-no-files-found: warn
          retention-days: 14

  maven:
    name: Maven 3.10.0 / JDK ${{ matrix.java }}
    # A security finding must not prevent native tests from producing their own evidence.
    needs: warm-cache
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Require successful dependency warmup
        if: needs.warm-cache.result != 'success'
        run: |
          echo '::error::Dependency warmup failed; compatibility tests cannot be skipped.'
          exit 1
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the matrix JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download warmed dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # action.yml at v7 defines name/path; retain validation elsewhere in this workflow.
        with:
          # noinspection UndefinedParamsPresent
          name: maven-dependencies
          # noinspection UndefinedParamsPresent
          path: build
      - name: Unpack downloaded dependencies
        run: python3 -B scripts/ci_dependency_cache.py restore maven
      - name: Seed the isolated Invoker repository
        run: python3 -B scripts/ci_dependency_cache.py seed-invoker
      - name: Set up Python for dependency verification
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Enable Maven dependency verification
        run: python3 -B scripts/maven_verification.py prepare
      - name: Verify Maven core, adapter and real runner builds
        run: bash ./mvnw -B -ntp -Dmaven.repo.local="$GITHUB_WORKSPACE/build/ci-dependencies/maven" verify
      - name: Retain Maven tests and Invoker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-maven-jdk-${{ matrix.java }}
          path: |
            shardpilot-core/target/surefire-reports/
            shardpilot-maven-plugin/target/surefire-reports/
            shardpilot-maven-plugin/target/invoker-reports/
            shardpilot-maven-plugin/target/it/**/build.log
            shardpilot-maven-plugin/target/it/execution-equivalence-*/target/executions/
            shardpilot-maven-plugin/target/it/execution-equivalence-*/build*.log
            shardpilot-maven-plugin/target/examples/**/build.log
            shardpilot-maven-plugin/target/examples/**/coverage.html
          if-no-files-found: warn
          retention-days: 14
