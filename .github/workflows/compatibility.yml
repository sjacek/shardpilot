name: Build tool and JDK compatibility

on:
  push:
    # Release tags call this workflow from publish.yml instead of starting a second matrix.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Gradle ${{ matrix.gradle }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep all results even if one supported runtime regresses.
      fail-fast: false
      matrix:
        gradle: ['9.0.0', '9.1.0', '9.8.1']
        java: ['17', '21', '25']
        exclude:
          # Running Gradle on JDK 25 is supported starting with Gradle 9.1.0.
          - gradle: '9.0.0'
            java: '25'
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the matrix JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Verify the plugin against the consumer runtime
        # The Wrapper stays fixed; every TestKit consumer uses matrix.gradle and the selected JDK.
        # Invoke through Bash because Windows checkouts may track gradlew without its executable bit.
        run: >-
          bash ./gradlew check assemble
          -PtestGradleVersion=${{ matrix.gradle }} -PtestJavaVersion=${{ matrix.java }}
          --stacktrace --console=plain
      - name: Retain test and validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-gradle-${{ matrix.gradle }}-jdk-${{ matrix.java }}
          path: |
            shardpilot-gradle-plugin/build/reports/
            shardpilot-gradle-plugin/build/test-results/test/
            shardpilot-core/build/reports/
            shardpilot-core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  release-artifacts:
    name: Signed Maven release bundle (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Java for release verification
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify the signed release with a disposable key
        run: bash scripts/verify-maven-release.sh
      - name: Set up Python for publication recovery tests
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify resilient Central status polling without publication credentials
        # Unit and loopback HTTP tests never contact Central or run a real Maven upload.
        run: python3 -B -m unittest discover -s scripts -p 'test_central_publication*.py' -v
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-signed-maven-release
          # The disposable private key lives only in a temporary directory and is never uploaded.
          path: build/release-verification/report.json
          if-no-files-found: warn
          retention-days: 14

  maven:
    name: Maven 3.9.16 / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up the matrix JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify Maven core, adapter and real runner builds
        run: bash ./mvnw -B -ntp verify
      - name: Retain Maven tests and Invoker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-maven-jdk-${{ matrix.java }}
          path: |
            shardpilot-core/target/surefire-reports/
            shardpilot-maven-plugin/target/surefire-reports/
            shardpilot-maven-plugin/target/invoker-reports/
            shardpilot-maven-plugin/target/it/**/build.log
            shardpilot-maven-plugin/target/examples/**/build.log
            shardpilot-maven-plugin/target/examples/**/coverage.html
          if-no-files-found: warn
          retention-days: 14
