import org.gradle.plugin.compatibility.CompatibilityExtension
import org.cyclonedx.gradle.CyclonedxDirectTask
import org.cyclonedx.Version
import org.cyclonedx.model.Component

plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
    id 'com.gradle.plugin-publish'
    id 'org.cyclonedx.bom'
}

project.setDescription(rootProject.description)
base { archivesName = 'shardpilot' }

evaluationDependsOn(':shardpilot-core')
def sharedCoreSources = project(':shardpilot-core').sourceSets.main

repositories {
    mavenCentral()
}

java {
    // The plugin bytecode is independent of the JDK used to compile consumer tests.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

gradlePlugin {
    website = 'https://github.com/sjacek/shardpilot'
    vcsUrl = 'https://github.com/sjacek/shardpilot.git'
    plugins {
        shardpilot { PluginDeclaration declaration ->
            declaration.setId('io.github.sjacek.shardpilot')
            declaration.setImplementationClass('io.github.sjacek.shardpilot.ShardPilotPlugin')
            declaration.setDisplayName('ShardPilot')
            declaration.setDescription(project.getDescription())
            declaration.tags.set(['testing', 'sharding', 'testng', 'spock', 'junit', 'ci'])
            // Use the typed extension API rather than the legacy dynamic Groovy compatibility helper.
            CompatibilityExtension featureCompatibility = ((ExtensionAware) declaration)
                    .getExtensions().getByType(CompatibilityExtension)
            // Strict TestKit fixtures verify this feature; no Isolated Projects claim is made.
            featureCompatibility.getFeatures().getConfigurationCache().set(true)
        }
    }
}

dependencies {
    // Bundle the shared classes into the existing plugin artifact, preserving Portal resolution
    // and the public Java package/API without requiring a separately published core dependency.
    implementation files(sharedCoreSources.output)
    // Manifest transport is YAML 1.2; this parser belongs to the Gradle plugin, not consumer test workers.
    implementation 'org.snakeyaml:snakeyaml-engine:3.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Exercise the standalone documentation utility without publishing it as plugin code.
sourceSets.test.java.srcDir(rootProject.file('scripts'))
// Standalone execution oracle is test infrastructure shared with Maven Invoker, not plugin code.
sourceSets.test.java.srcDir(rootProject.file('testing/java'))

// Model shared fixtures explicitly for Gradle/IDE import. Separate classpaths keep identical
// JUnit/TestNG class names isolated; these intentionally failing suites have no local Test task.
sourceSets {
    executionJunitFixture {
        java.setSrcDirs([rootProject.file('testing/execution-equivalence/junit/src')])
        resources.setSrcDirs([rootProject.file('testing/execution-equivalence/junit/resources')])
    }
    executionSpockFixture {
        groovy.setSrcDirs([rootProject.file('testing/execution-equivalence/spock/src')])
    }
    executionTestNgFixture {
        java.setSrcDirs([rootProject.file('testing/execution-equivalence/testng/src')])
    }
}

dependencies {
    executionJunitFixtureImplementation platform('org.junit:junit-bom:6.1.3')
    executionJunitFixtureImplementation 'org.junit.jupiter:junit-jupiter'
    executionJunitFixtureImplementation 'org.junit.platform:junit-platform-launcher'
    executionSpockFixtureImplementation 'org.spockframework:spock-core:2.5-groovy-5.0'
    executionSpockFixtureImplementation 'org.apache.groovy:groovy:5.1.3'
    executionSpockFixtureImplementation 'org.junit.platform:junit-platform-launcher:6.1.3'
    executionTestNgFixtureImplementation 'org.testng:testng:7.12.0'
}

// This boundary ships bundled core classes plus external runtime libraries. Tests, Gradle APIs
// and producer plugins belong to other scopes and must not appear as distributed dependencies.
tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
    includeConfigs = ['runtimeClasspath']
    includeBuildEnvironment = false
    componentName = 'shardpilot'
    projectType = Component.Type.LIBRARY
    schemaVersion = Version.VERSION_16
    jsonOutput = layout.buildDirectory.file('reports/security/gradle/bom.raw.json')
    xmlOutput.convention((RegularFile) null)
}

// Infer the annotated Provider type; an explicit generic declaration can confuse Groovy IDEs.
def testKitDirectory = providers.environmentVariable('SHARDPILOT_TESTKIT_DIR')
        .orElse(layout.buildDirectory.dir('testkit').get().asFile.absolutePath)

test {
    useJUnitPlatform()
    // Compile the imported fixture model too; TestKit/Invoker alone execute and compare its tests.
    dependsOn sourceSets.executionJunitFixture.classesTaskName, sourceSets.executionSpockFixture.classesTaskName,
            sourceSets.executionTestNgFixture.classesTaskName
    workingDir = rootProject.projectDir
    inputs.file(rootProject.file('gradle/release-verification.gradle')).withPropertyName('releaseTagVerificationScript')
    inputs.files(rootProject.file('.github/workflows/compatibility.yml'), rootProject.file('.github/workflows/publish.yml'),
            rootProject.file('.github/workflows/security.yml'), rootProject.file('.github/workflows/published-artifact-audit.yml'))
            .withPropertyName('releaseWorkflowConfiguration')
    inputs.files(rootProject.file('security/published-artifact-audit.json'),
            rootProject.fileTree('testing/published-artifacts'), rootProject.file('scripts/published_artifacts.py'),
            rootProject.file('scripts/run_published_artifact_audit.py'), rootProject.file('scripts/published_audit_report.py'))
            .withPropertyName('publishedArtifactAudit')
    inputs.files(rootProject.file('security/scan-policy.json'), rootProject.file('security/grype.yaml'),
            rootProject.file('scripts/security_reports.py')).withPropertyName('runtimeSecurityPolicy')
    inputs.files(rootProject.file('build.gradle'), rootProject.file('gradle/wrapper/gradle-wrapper.properties'),
            rootProject.file('gradle/wrapper/gradle-wrapper.jar')).withPropertyName('gradleWrapperConfiguration')
    inputs.files(rootProject.file('pom.xml'), rootProject.file('shardpilot-core/pom.xml'),
            rootProject.file('shardpilot-maven-plugin/pom.xml'), rootProject.file('.mvn/wrapper/maven-wrapper.properties'))
            .withPropertyName('mavenReactorConfiguration')
    inputs.file(rootProject.file('scripts/verify-maven-release.sh')).withPropertyName('signedMavenReleaseCheck')
    inputs.file(rootProject.file('scripts/central_publication.py')).withPropertyName('centralPublicationHelper')
    inputs.files(rootProject.file('gradle/verification-metadata.xml'), rootProject.file('.mvn/maven.config'),
            rootProject.file('security/action-pins.json'), rootProject.file('.github/dependabot.yml'),
            rootProject.file('.mvn/checksums.sha256'), rootProject.file('security/dependency-verification.json'),
            rootProject.file('scripts/maven_verification.py'), rootProject.file('scripts/dependency_policy.py'),
            rootProject.file('scripts/prepare-maven-consumer-checksums.groovy'),
            rootProject.file('gradle/verification-fixtures.gradle')).withPropertyName('dependencyVerificationPolicy')
    systemProperty 'shardpilot.test.verificationMetadata', rootProject.file('gradle/verification-metadata.xml').absolutePath
    // NormalizeSvgTest inspects committed previews; changed renders must invalidate cached results.
    inputs.files(rootProject.fileTree('docs/diagrams') { include '*.puml', '*.svg' })
            .withPropertyName('documentationDiagramPreviews')
    // Example tests consume real repository files; edits must invalidate up-to-date/build-cache hits.
    inputs.files(rootProject.fileTree('examples/ci') { include '*/.gitlab-ci.yml' })
            .withPropertyName('historyRefreshCiExamples')
    inputs.files(rootProject.fileTree('examples/gradle/junit-jupiter/duration-history') {
        include 'build.gradle', 'settings.gradle', 'gradle.properties', 'durations.tsv', 'src/**'
    }).withPropertyName('historyRefreshConsumerExample')
    inputs.files(rootProject.fileTree('testing/execution-equivalence')).withPropertyName('nativeExecutionFixtures')
    // Check the actual publication model, including the marker, rather than only a composite classpath.
    def metadataTasks = tasks.matching { it.name in ['generatePomFileForPluginMavenPublication',
            'generatePomFileForShardpilotPluginMarkerMavenPublication', 'generateMetadataFileForPluginMavenPublication'] }
    dependsOn metadataTasks
    inputs.files(metadataTasks).withPropertyName('gradlePublicationMetadata')
    systemProperty 'shardpilot.test.publicationDirectory', layout.buildDirectory.dir('publications').get().asFile.absolutePath
    systemProperty 'shardpilot.test.releaseVersion', project.version.toString()
    def pluginArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(pluginArchive).withPropertyName('distributablePluginJar')
    systemProperty 'shardpilot.test.pluginJar', pluginArchive.get().asFile.absolutePath
    // The Wrapper builds the plugin; TestKit independently selects the consumer's Gradle runtime.
    // A system property is also a Test input, so switching matrix cells cannot reuse old results.
    systemProperty 'shardpilot.test.gradleVersion',
            providers.gradleProperty('testGradleVersion').orElse(gradle.gradleVersion).get()
    systemProperty 'shardpilot.test.javaVersion',
            providers.gradleProperty('testJavaVersion').orElse(JavaVersion.current().majorVersion).get()
    // CI restores only downloaded dependencies/distributions here; fixture projects stay temporary.
    systemProperty 'org.gradle.testkit.dir', testKitDirectory.get()
    // TestKit launches nested builds; keep their memory budgets independent of test parallelism.
    maxParallelForks = 1
    maxHeapSize = '512m'
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

// Resolve fixture libraries and consumer distributions sequentially, without executing any tests.
tasks.register('warmTestKitCache', JavaExec) {
    group = 'verification'
    description = 'Download TestKit dependencies and consumer distributions before the CI matrix.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.sjacek.shardpilot.TestKitCacheWarmup'
    args testKitDirectory.get()
    args layout.buildDirectory.dir('cache-warmup').get().asFile.absolutePath
    args rootProject.file('gradle/verification-metadata.xml').absolutePath
    args providers.gradleProperty('testGradleVersions').orElse(gradle.gradleVersion).get().split(',')
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
}

tasks.named('jar', Jar) { from sharedCoreSources.output }
tasks.named('sourcesJar', Jar) { from sharedCoreSources.allSource }
tasks.named('javadoc', Javadoc) { source sharedCoreSources.allJava }
tasks.named('check') { dependsOn ':shardpilot-core:check' }

publishing {
    publications.withType(MavenPublication).configureEach {
        if (name == 'pluginMaven') artifactId = 'shardpilot'
        pom { MavenPom pom ->
            pom.getName().set('ShardPilot')
            pom.getDescription().set(project.getDescription())
            pom.getUrl().set(gradlePlugin.website.get())
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/license/mit'
                    distribution = 'repo'
                }
            }
            developers {
                developer { id = 'sjacek'; name = 'sjacek'; url = 'https://github.com/sjacek' }
            }
            scm {
                connection = 'scm:git:https://github.com/sjacek/shardpilot.git'
                developerConnection = 'scm:git:ssh://git@github.com/sjacek/shardpilot.git'
                url = gradlePlugin.website
                tag = "v${project.version}"
            }
        }
    }
}
