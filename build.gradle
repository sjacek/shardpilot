plugins {
    id 'base'
    id 'com.gradle.plugin-publish' version '2.2.1' apply false
}

allprojects {
    group = 'io.github.sjacek'
    version = '0.3.1'
}

// The Gradle adapter uses this text for both its Portal listing and publication POMs.
// Native Maven artifacts have their own descriptions in their respective pom.xml files.
project.setDescription('ShardPilot helps shorten CI feedback for large JVM unit and integration test suites by splitting ' +
        'Gradle Test tasks into deterministic, non-overlapping class-level shards for parallel CI jobs. ' +
        'It balances class families using historical test durations, with stable hashing when timing data is unavailable. ' +
        'Works with existing JUnit Jupiter, Spock and TestNG tasks while preserving nested test families and configured test filters. ' +
        'Optional per-task controls set worker heap size, parallel forks and process recycling. ' +
        'Opt-in YAML class manifests and standalone JSON and HTML reports compare planned assignments with class selections collected from CI jobs. ' +
        'Supports Gradle Configuration Cache and any CI provider without a coordinator, replacement test runner or telemetry. ' +
        'Your CI launches every shard and collects the results; class-selection verification complements normal test result checks.')

apply from: 'gradle/release-verification.gradle'

tasks.named('check') { dependsOn ':shardpilot-core:check', ':shardpilot-gradle-plugin:check' }
tasks.named('assemble') { dependsOn ':shardpilot-core:assemble', ':shardpilot-gradle-plugin:assemble' }

tasks.named('wrapper') {
    gradleVersion = '9.8.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}
