plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'io.github.sjacek'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    // The plugin bytecode is independent of the JDK used to compile consumer tests.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

gradlePlugin {
    plugins {
        shardpilot { PluginDeclaration declaration ->
            declaration.setId('io.github.sjacek.shardpilot')
            declaration.setImplementationClass('io.github.sjacek.shardpilot.ShardPilotPlugin')
            declaration.setDisplayName('ShardPilot')
            declaration.setDescription('Duration-balanced class-level test sharding for Gradle, without a coordinator.')
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Exercise the standalone documentation utility without publishing it as plugin code.
sourceSets.test.java.srcDir('scripts')

test {
    useJUnitPlatform()
    // TestKit launches nested builds; keep their memory budgets independent of test parallelism.
    maxParallelForks = 1
    maxHeapSize = '512m'
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'ShardPilot'
            description = 'Duration-balanced class-level test sharding for Gradle.'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/license/mit'
                    distribution = 'repo'
                }
            }
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}
