# The same runnable POM is exercised by the plugin's isolated Maven Invoker build.
invoker.goals.1 = test-compile shardpilot:prepare -Dshardpilot.count=2
invoker.goals.2 = shardpilot:prepare -Dshardpilot.count=2 -Dshardpilot.runner=FAILSAFE
invoker.goals.3 = verify -Dshardpilot.count=2 -Dshardpilot.index=1
invoker.goals.4 = verify -Dshardpilot.count=2 -Dshardpilot.index=2
invoker.goals.5 = shardpilot:verify -Dshardpilot.count=2
invoker.goals.6 = shardpilot:verify -Dshardpilot.count=2 -Dshardpilot.runner=FAILSAFE
# Artifact-only refresh must not run native tests again or mix the two suites.
invoker.goals.7 = shardpilot:refresh-durations -Dshardpilot.count=2 -Dshardpilot.minimumCoverage=1
invoker.goals.8 = shardpilot:refresh-durations -Dshardpilot.count=2 -Dshardpilot.minimumCoverage=1 -Dshardpilot.runner=FAILSAFE
