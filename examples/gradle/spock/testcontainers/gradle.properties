# Reuse configuration without relaxing serialization checks or caching live integration results.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
# This budget belongs to the Gradle daemon; the Test task sets a separate worker heap.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
# Bounds Gradle work units, not Spock threads, Docker processes or the number of CI shards.
org.gradle.workers.max=2
