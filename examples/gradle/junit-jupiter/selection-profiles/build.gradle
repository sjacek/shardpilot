plugins { id 'java'; id 'io.github.sjacek.shardpilot' }
repositories { mavenCentral() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    include '**/*Test.class'
    exclude '**/*$*.class'
    maxHeapSize = '256m'
    shardPilot { enabled = true; durationsFile = layout.projectDirectory.file('durations.tsv') }
}
def eligible = sourceSets.test.output.classesDirs.asFileTree.matching {
    include '**/*Test.class'
    exclude '**/*$*.class'
}
def pilot = tasks.named('test', Test).get().shardPilot
// Independent E is always required. CLI -Pshardpilot.selection* overrides these conventions.
pilot.selection {
    policyFile.convention(layout.projectDirectory.file('policy.yaml'))
    profile.convention('smoke-testdata')
    eligibleClasses.from(eligible)
}
pilot.verification { eligibleClasses.from(eligible) }
// Preserve XML from both demonstration nodes; ordinary CI jobs have isolated workspaces.
def profile = providers.gradleProperty('shardpilot.selectionProfile').orElse('smoke-testdata')
def node = providers.gradleProperty('shardpilot.index').orElse('1')
def reportPath = profile.zip(node) { String p, String n ->
    "shardpilot/test/selections/profile-${p}/test-results/${n}".toString()
}
def reportDirectory = layout.buildDirectory.zip(reportPath) { Directory base, String path ->
    base.dir(path).asFile
}
test.reports.junitXml.outputLocation.fileProvider(reportDirectory)
