# Reuse build configuration without relaxing serialization checks or caching live integration results.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
# This is the Gradle daemon budget; the Test task configures its worker heap separately.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
# Bounds Gradle work units, not TestNG threads, Docker processes or the number of CI shards.
org.gradle.workers.max=2
