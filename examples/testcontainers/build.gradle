plugins {
    id 'java'
    id 'io.github.sjacek.shardpilot'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

// The consuming build owns source sets and lifecycle wiring; ShardPilot only filters Test tasks.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    // Reuse the Jupiter API/launcher, but keep container dependencies out of ordinary unit tests.
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // No Testcontainers Jupiter extension: the worker-local holder owns the shared service lifecycle.
    integrationTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
    integrationTestImplementation 'org.testcontainers:testcontainers-rabbitmq'
    integrationTestImplementation 'org.postgresql:postgresql:42.7.14'
    integrationTestImplementation 'com.rabbitmq:amqp-client:5.37.0'
    integrationTestRuntimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def integrationTests = tasks.register('integrationTest', Test) {
    description = 'Runs sharded integration tests against worker-local PostgreSQL and RabbitMQ.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    // Select outer integration classes. Jupiter discovers their nested tests from the intact classpath.
    include '**/*IT.class'
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')

    // CI shards run independently. Keep classes/methods sequential inside each worker,
    // and keep that worker alive so its singleton fixtures are not restarted per class.
    maxParallelForks = 1
    forkEvery = 0
    maxHeapSize = '384m'
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    // The Docker client uses JNA; declare its native access explicitly on current JDKs.
    jvmArgs '--enable-native-access=ALL-UNNAMED'

    // These tests exercise live services, not cached reports from an earlier execution.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }

    shardPilot {
        enabled = true
        // Demonstration weights are synthetic; every shard must use the same immutable snapshot.
        durationsFile = layout.projectDirectory.file('integration-test-durations.tsv')
    }

    // Forward explicit image overrides without reading environment variables in test fixtures.
    ['example.postgresImage', 'example.rabbitmqImage'].each { String property ->
        def override = providers.gradleProperty(property)
        if (override.isPresent()) systemProperty property, override.get()
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// This standalone example deliberately requires Docker for check; the plugin build does not.
tasks.named('check') {
    dependsOn integrationTests
}
