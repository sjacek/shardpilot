import org.cyclonedx.gradle.CyclonedxDirectTask
import org.cyclonedx.Version

plugins {
    id 'java-library'
    id 'org.cyclonedx.bom'
}

// Group and version are configured for all projects in the root build.gradle.
repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
dependencies {
    implementation 'org.snakeyaml:snakeyaml-engine:3.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    maxHeapSize = '256m'
}

// The Gradle distribution embeds these classes. Its final inventory joins this resolved graph
// with the plugin graph and verifies the class bytes against the assembled plugin JAR.
tasks.named('cyclonedxDirectBom', CyclonedxDirectTask) {
    includeConfigs = ['runtimeClasspath']
    includeBuildEnvironment = false
    schemaVersion = Version.VERSION_16
    jsonOutput = layout.buildDirectory.file('reports/security/gradle/bom.raw.json')
    xmlOutput.convention((RegularFile) null)
}
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
}
